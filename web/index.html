<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AssetForge — Relic Run</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --accent:#ffb45e; --bg:#12100d; --panel:rgba(16,14,11,.88); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; overflow:hidden; background:var(--bg);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; color:#e8e2d6; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }
  .hud { position:fixed; z-index:10; pointer-events:none; }
  #top { top:14px; left:16px; }
  #title { font-size:15px; letter-spacing:.06em; color:#fff; text-shadow:0 1px 3px #000; }
  #subtitle { font-size:11px; color:#bdb4a2; margin-top:3px; }
  #packbar { top:14px; right:16px; text-align:right; }
  #packbar button { pointer-events:auto; background:var(--panel); color:#e8e2d6;
    border:1px solid #4a4438; padding:7px 12px; margin-left:8px; cursor:pointer;
    font:inherit; font-size:11.5px; letter-spacing:.04em; border-radius:3px; }
  #packbar button:hover { border-color:var(--accent); color:#fff; }
  #packbar button.active { border-color:var(--accent); color:var(--accent); }
  #hud-center { top:56%; left:50%; transform:translate(-50%,-50%); text-align:center;
    font-size:22px; color:#fff; text-shadow:0 2px 8px #000; opacity:0;
    transition:opacity .25s; letter-spacing:.04em; }
  #toast { bottom:76px; left:50%; transform:translateX(-50%); font-size:12.5px;
    background:var(--panel); border:1px solid #3c3629; padding:8px 14px; border-radius:3px;
    opacity:0; transition:opacity .25s; max-width:70vw; text-align:center; }
  #receipts { bottom:14px; left:16px; background:var(--panel); border:1px solid #34302a;
    border-radius:4px; padding:10px 12px; font-size:10.5px; line-height:1.75; min-width:250px; }
  #receipts .hd { color:#9a9082; letter-spacing:.08em; margin-bottom:5px; font-size:10px; }
  #receipts .row { display:flex; gap:8px; align-items:baseline; }
  #receipts .slot { color:#e8e2d6; min-width:64px; }
  #receipts .sha { color:#77705f; }
  #receipts .badge { margin-left:auto; color:#8fd694; }
  #receipts .badge.pending { color:#77705f; }
  #counter { bottom:14px; right:16px; font-size:13px; color:#e8e2d6;
    background:var(--panel); border:1px solid #34302a; border-radius:4px; padding:9px 13px; }
  #counter b { color:var(--accent); }
  #help { top:52px; left:16px; font-size:10.5px; color:#8c8474; }
  #loading { position:fixed; inset:0; z-index:20; display:flex; align-items:center;
    justify-content:center; background:#0d0b09; color:#bdb4a2; font-size:13px;
    letter-spacing:.08em; }
  #loading .spin { display:inline-block; animation:spin 1.1s linear infinite; margin-right:9px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #error { position:fixed; inset:0; z-index:30; display:none; align-items:center;
    justify-content:center; background:#0d0b09; color:#e8e2d6; font-size:13px;
    padding:24px; text-align:center; line-height:2; }
</style>
</head>
<body>
<div id="app"></div>
<div class="hud" id="top">
  <div id="title">ASSETFORGE — RELIC RUN</div>
  <div id="subtitle">every relic below was AI-generated &amp; machine-verified</div>
</div>
<div class="hud" id="packbar">
  <button id="btn-cozy-dungeon" class="active">cozy-dungeon.yaml</button>
  <button id="btn-sci-fi-outpost">sci-fi-outpost.yaml</button>
</div>
<div class="hud" id="help">drag to orbit · scroll to zoom · click a relic to verify &amp; collect</div>
<div class="hud" id="hud-center"></div>
<div class="hud" id="toast"></div>
<div class="hud" id="receipts"><div class="hd">RECEIPTS (offline-verified)</div></div>
<div class="hud" id="counter">relics <b id="n">0</b>/<span id="total">0</span></div>
<div id="loading"><span><span class="spin">◌</span>LOADING PACK…</span></div>
<div id="error"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
<script type="module" src="./game.js"></script>
</body>
</html>
